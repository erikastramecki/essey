<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Essey · D.O.N. — the on-chain city where the odds and the books are both provable</title>
    <meta name="description" content="8,888 Dons, timed jobs with published odds, raids, and a Vault nothing can touch. Provably fair AND provably solvent, on Robinhood Chain testnet." />
    <script>
      // Stamp the theme before first paint so light-mode visitors never flash dark (styles.css keys
      // every token off [data-theme]). localStorage choice wins; OS preference is the default.
      (function () {
        try {
          var t = localStorage.getItem("essey-theme")
            || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.dataset.theme = t;
        } catch (e) { document.documentElement.dataset.theme = "dark"; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
