<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Essey — the stock-market club where the odds and the books are both provable</title>
    <meta name="description" content="Buy a Seat, earn Payouts in real stock, borrow against them. Provably fair AND provably solvent — every claim links a real on-chain transaction, and every adversarial audit round is published, clean or not." />
    <script>
      // Stamp the theme before first paint so light-mode visitors never flash dark (styles.css keys
      // every token off [data-theme]). localStorage choice wins; OS preference is the default.
      (function () {
        try {
          var t = localStorage.getItem("essey-theme")
            || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.dataset.theme = t;
        } catch (e) { document.documentElement.dataset.theme = "dark"; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
