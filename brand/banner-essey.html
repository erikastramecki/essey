<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1500px; height:500px; overflow:hidden; }
  .b {
    width:1500px; height:500px; position:relative; background:#0A0C11;
    background-image:
      radial-gradient(900px 520px at 50% -30%, rgba(212,169,78,.16), transparent 62%),
      radial-gradient(700px 460px at 50% 130%, rgba(120,140,190,.06), transparent 62%);
    font-family:"Helvetica Neue",Arial,sans-serif; overflow:hidden;
  }
  /* CENTERED + mobile-safe. Twitter crops the banner hard on mobile and the avatar overlays the
     BOTTOM-LEFT, so the whole composition is centered horizontally and nudged UP from center, well
     clear of every edge — a simple centered lock survives the crop where a wide split layout doesn't. */
  .content { position:absolute; left:50%; top:44%; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; text-align:center; }
  .lock { display:flex; align-items:center; gap:26px; }
  .mk { width:112px; height:112px; filter:drop-shadow(0 8px 22px rgba(212,169,78,.34)); }
  .word { font-family:"Didot","Bodoni 72","New York",Georgia,serif; font-size:120px; line-height:.9; color:#F3EFE7; letter-spacing:-.01em; }
  .tag { margin-top:34px; font-size:40px; color:#D7DBE4; font-weight:300; letter-spacing:.005em; }
  .tag b { color:#E7C57A; font-weight:500; font-style:italic; }
  .eyebrow { margin-top:20px; font-family:"SFMono-Regular",Menlo,monospace; font-size:16px;
    letter-spacing:.30em; text-transform:uppercase; color:#D4A94E; }
</style></head>
<body>
  <div class="b">
    <div class="content">
      <div class="lock">
        <svg class="mk" viewBox="0 0 100 100" fill="none">
          <defs>
            <linearGradient id="g" x1="50" y1="6" x2="50" y2="94" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#E7C57A"/><stop offset="1" stop-color="#C89A3E"/></linearGradient>
            <linearGradient id="gf" x1="50" y1="6" x2="50" y2="94" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="rgba(212,169,78,.16)"/><stop offset="1" stop-color="rgba(212,169,78,.04)"/></linearGradient>
          </defs>
          <path d="M50 7.81 L89.06 28.13 L89.06 71.88 L50 92.19 L10.94 71.88 L10.94 28.13 Z"
                fill="url(#gf)" stroke="url(#g)" stroke-width="3.4" stroke-linejoin="round"/>
          <path d="M50 16.4 L81.4 32.7 L81.4 67.3 L50 83.6 L18.6 67.3 L18.6 32.7 Z"
                stroke="rgba(231,197,122,.20)" stroke-width="1.1" stroke-linejoin="round" fill="none"/>
          <text x="50" y="51.5" text-anchor="middle" dominant-baseline="central"
                font-family="Didot,'Bodoni 72','Hoefler Text',Georgia,serif" font-size="52" fill="#E7C57A">E</text>
        </svg>
        <div class="word">Essey</div>
      </div>
      <div class="tag">Provably fair <b>and</b> provably solvent.</div>
      <div class="eyebrow">the stock-market club, on-chain &nbsp;·&nbsp; essey.xyz</div>
    </div>
  </div>
</body></html>
