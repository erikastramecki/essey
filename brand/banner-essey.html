<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1500px; height:500px; overflow:hidden; }
  .b {
    width:1500px; height:500px; position:relative; background:#0A0C11;
    background-image:
      radial-gradient(1100px 620px at 50% -20%, rgba(212,169,78,.14), transparent 62%),
      radial-gradient(760px 480px at 50% 130%, rgba(120,140,190,.06), transparent 62%);
    font-family:"Helvetica Neue",Arial,sans-serif; overflow:hidden;
  }
  /* VARIANT B — WORDMARK ONLY. The @EsseyMarkets avatar already carries the hexagon-E monogram, so the
     banner doesn't repeat it — it leads with the wordmark and lets the avatar be the mark. Truly centered
     and compact (central ~55% vertically, ~78% horizontally) so Twitter's taller/wider mobile crop and
     the bottom-left avatar overlay never clip it. A thin gold hairline under the wordmark gives it
     structure without competing with the avatar. */
  .content { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; text-align:center; }
  .word { font-family:"Didot","Bodoni 72","New York",Georgia,serif; font-size:118px; line-height:.9;
    color:#F3EFE7; letter-spacing:.005em; }
  .rule { width:118px; height:2px; margin-top:22px;
    background:linear-gradient(90deg, transparent, #C89A3E, transparent); }
  .tag { margin-top:22px; font-size:33px; color:#D7DBE4; font-weight:300; letter-spacing:.005em; }
  .tag b { color:#E7C57A; font-weight:500; font-style:italic; }
  .eyebrow { margin-top:15px; font-family:"SFMono-Regular",Menlo,monospace; font-size:15px;
    letter-spacing:.22em; text-transform:uppercase; color:#D4A94E; }
</style></head>
<body>
  <div class="b">
    <div class="content">
      <div class="word">Essey</div>
      <div class="rule"></div>
      <div class="tag">Provably fair <b>and</b> provably solvent.</div>
      <div class="eyebrow">the stock-market club, on-chain &nbsp;·&nbsp; essey.xyz</div>
    </div>
  </div>
</body></html>
