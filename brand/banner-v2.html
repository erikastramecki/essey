<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1500px; height:500px; overflow:hidden; }
  .b {
    width:1500px; height:500px; position:relative; background:#0A0C11;
    background-image:
      radial-gradient(760px 420px at 78% -20%, rgba(212,169,78,.15), transparent 60%),
      radial-gradient(620px 380px at 20% 120%, rgba(120,140,190,.07), transparent 60%);
    font-family:"Helvetica Neue",Arial,sans-serif; overflow:hidden;
  }
  /* MOBILE-SAFE ZONE: Twitter crops top/bottom hard and the avatar sits bottom-left.
     Everything essential lives in the vertical center band, pulled in from the edges. */
  .content { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:1180px; display:flex; align-items:center; justify-content:space-between; gap:40px; }
  .left { }
  .lock { display:flex; align-items:center; gap:22px; }
  .mk { width:78px; height:78px; filter:drop-shadow(0 6px 18px rgba(212,169,78,.30)); }
  .word { font-family:"Didot","Bodoni 72","New York",Georgia,serif; font-size:96px; line-height:.9; color:#F3EFE7; letter-spacing:-.01em; }
  .tag { margin-top:20px; font-size:30px; color:#D7DBE4; font-weight:300; }
  .tag b { color:#F3EFE7; font-weight:500; }
  .eyebrow { margin-top:16px; font-family:"SFMono-Regular",Menlo,monospace; font-size:14px;
    letter-spacing:.26em; text-transform:uppercase; color:#D4A94E; }
  /* right: the "any chain" motif — a few dim nodes, then all-gold */
  .motif { display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; gap:9px; }
  .n { width:20px; height:20px; border-radius:5px; background:#1E2430; border:1px solid #2E3648; }
  .n.dim { background:#3a4356; border-color:#4a5568; }
  .n.on { background:#D4A94E; border-color:#E7C57A; box-shadow:0 0 8px rgba(212,169,78,.4); }
  .rlabel { font-family:"SFMono-Regular",Menlo,monospace; font-size:11px; letter-spacing:.14em; color:#616A7B; text-transform:uppercase; align-self:center; margin-left:6px; }
</style></head>
<body>
  <div class="b">
    <div class="content">
      <div class="left">
        <div class="lock">
          <svg class="mk" viewBox="0 0 100 100" fill="none">
            <defs>
              <linearGradient id="g" x1="50" y1="6" x2="50" y2="94" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#E7C57A"/><stop offset="1" stop-color="#C89A3E"/></linearGradient>
              <linearGradient id="gf" x1="50" y1="6" x2="50" y2="94" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="rgba(212,169,78,.16)"/><stop offset="1" stop-color="rgba(212,169,78,.04)"/></linearGradient>
            </defs>
            <path d="M50 7.81 L89.06 28.13 L89.06 71.88 L50 92.19 L10.94 71.88 L10.94 28.13 Z"
                  fill="url(#gf)" stroke="url(#g)" stroke-width="3.4" stroke-linejoin="round"/>
            <path d="M34.4 50.6 L45 61.25 L66.9 37.5" stroke="#E7C57A" stroke-width="5.2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="word">Essey</div>
        </div>
        <div class="tag">Borrow against your <b>onchain assets</b> — on <b>any chain</b>.</div>
        <div class="eyebrow">the proof is the oracle &nbsp;·&nbsp; essey.xyz</div>
      </div>
      <div class="motif">
        <div class="row">
          <span class="n dim"></span><span class="n dim"></span><span class="n dim"></span><span class="n"></span><span class="n"></span><span class="n"></span><span class="n"></span>
          <span class="rlabel">others</span>
        </div>
        <div class="row">
          <span class="n on"></span><span class="n on"></span><span class="n on"></span><span class="n on"></span><span class="n on"></span><span class="n on"></span><span class="n on"></span>
          <span class="rlabel">essey</span>
        </div>
      </div>
    </div>
  </div>
</body></html>
