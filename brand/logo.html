<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:400px; height:400px; overflow:hidden; }
  .frame {
    width:400px; height:400px; position:relative;
    background:
      radial-gradient(300px 300px at 50% 44%, rgba(212,169,78,.16), transparent 62%),
      radial-gradient(circle at 50% 40%, #14171F, #0A0C11 72%);
  }
  .mark { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:214px; height:214px;
    filter: drop-shadow(0 10px 34px rgba(212,169,78,.30)); }
</style></head>
<body>
  <div class="frame">
    <svg class="mark" viewBox="0 0 100 100" fill="none">
      <defs>
        <linearGradient id="g" x1="50" y1="6" x2="50" y2="94" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#E7C57A"/>
          <stop offset="1" stop-color="#C89A3E"/>
        </linearGradient>
        <linearGradient id="gf" x1="50" y1="6" x2="50" y2="94" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="rgba(212,169,78,.16)"/>
          <stop offset="1" stop-color="rgba(212,169,78,.04)"/>
        </linearGradient>
      </defs>
      <!-- hallmark hexagon (your site silhouette, refined) -->
      <path d="M50 7.81 L89.06 28.13 L89.06 71.88 L50 92.19 L10.94 71.88 L10.94 28.13 Z"
            fill="url(#gf)" stroke="url(#g)" stroke-width="3.4" stroke-linejoin="round"/>
      <!-- inner facet, struck-ingot depth -->
      <path d="M50 16.4 L81.4 32.7 L81.4 67.3 L50 83.6 L18.6 67.3 L18.6 32.7 Z"
            stroke="rgba(231,197,122,.22)" stroke-width="1.1" stroke-linejoin="round"/>
      <!-- assay check -->
      <path d="M34.4 50.6 L45 61.25 L66.9 37.5" stroke="#E7C57A" stroke-width="5.2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</body></html>
