<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:400px;height:400px;overflow:hidden}
  .frame{width:400px;height:400px;position:relative;
    background:
      radial-gradient(300px 300px at 50% 44%, rgba(212,169,78,.16), transparent 62%),
      radial-gradient(circle at 50% 40%, #14171F, #0A0C11 72%);}
  .mk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:224px;height:224px;
    filter:drop-shadow(0 10px 34px rgba(212,169,78,.30));}
</style></head>
<body>
  <div class="frame">
    <svg class="mk" viewBox="0 0 100 100" fill="none">
      <defs>
        <linearGradient id="g" x1="50" y1="6" x2="50" y2="94" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#E7C57A"/><stop offset="1" stop-color="#C89A3E"/></linearGradient>
        <linearGradient id="gf" x1="50" y1="6" x2="50" y2="94" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="rgba(212,169,78,.16)"/><stop offset="1" stop-color="rgba(212,169,78,.04)"/></linearGradient>
        <linearGradient id="ge" x1="50" y1="30" x2="50" y2="72" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#F0D79A"/><stop offset="1" stop-color="#D4A94E"/></linearGradient>
      </defs>
      <path d="M50 7.81 L89.06 28.13 L89.06 71.88 L50 92.19 L10.94 71.88 L10.94 28.13 Z"
            fill="url(#gf)" stroke="url(#g)" stroke-width="3.4" stroke-linejoin="round"/>
      <path d="M50 16.4 L81.4 32.7 L81.4 67.3 L50 83.6 L18.6 67.3 L18.6 32.7 Z"
            stroke="rgba(231,197,122,.20)" stroke-width="1.1" stroke-linejoin="round" fill="none"/>
      <text x="50" y="51.5" text-anchor="middle" dominant-baseline="central"
            font-family="Didot,'Bodoni 72','Hoefler Text',Georgia,serif" font-size="50" fill="url(#ge)">E</text>
    </svg>
  </div>
</body></html>
