<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1500px; height:500px; overflow:hidden; }
  .b {
    width:1500px; height:500px; position:relative; background:#0A0C11;
    background-image:
      radial-gradient(900px 460px at 82% -12%, rgba(212,169,78,.16), transparent 58%),
      radial-gradient(680px 400px at 6% 108%, rgba(120,140,190,.08), transparent 60%);
    font-family:"Helvetica Neue",Arial,sans-serif; overflow:hidden;
  }
  /* faint hallmark watermark, bleeding off the right */
  .wm { position:absolute; right:-90px; top:50%; transform:translateY(-50%); width:560px; height:560px; opacity:.06; }
  .content { position:absolute; left:112px; top:50%; transform:translateY(-50%); }
  .lockup { display:flex; align-items:center; gap:26px; }
  .lockup .mk { width:92px; height:92px; filter:drop-shadow(0 6px 20px rgba(212,169,78,.28)); }
  .word { font-family:"Didot","Bodoni 72","New York",Georgia,serif; font-size:118px; line-height:.9;
    color:#F3EFE7; letter-spacing:-.01em; }
  .tag { margin-top:26px; font-size:33px; color:#C7CDDA; font-weight:300; letter-spacing:.005em; }
  .tag b { color:#F3EFE7; font-weight:500; }
  .eyebrow { margin-top:20px; font-family:"SFMono-Regular",Menlo,monospace; font-size:15.5px;
    letter-spacing:.28em; text-transform:uppercase; color:#D4A94E; }
  .url { position:absolute; right:56px; bottom:40px; font-family:"SFMono-Regular",Menlo,monospace;
    font-size:20px; letter-spacing:.14em; color:#D4A94E; opacity:.9; }
  .hair { position:absolute; left:112px; right:56px; bottom:104px; height:1px;
    background:linear-gradient(90deg, rgba(212,169,78,.28), rgba(212,169,78,0) 62%); }
</style></head>
<body>
  <div class="b">
    <svg class="wm" viewBox="0 0 100 100" fill="none">
      <path d="M50 7.81 L89.06 28.13 L89.06 71.88 L50 92.19 L10.94 71.88 L10.94 28.13 Z"
            stroke="#D4A94E" stroke-width="2" stroke-linejoin="round"/>
      <path d="M34.4 50.6 L45 61.25 L66.9 37.5" stroke="#D4A94E" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <div class="content">
      <div class="lockup">
        <svg class="mk" viewBox="0 0 100 100" fill="none">
          <defs>
            <linearGradient id="g" x1="50" y1="6" x2="50" y2="94" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#E7C57A"/><stop offset="1" stop-color="#C89A3E"/>
            </linearGradient>
            <linearGradient id="gf" x1="50" y1="6" x2="50" y2="94" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="rgba(212,169,78,.16)"/><stop offset="1" stop-color="rgba(212,169,78,.04)"/>
            </linearGradient>
          </defs>
          <path d="M50 7.81 L89.06 28.13 L89.06 71.88 L50 92.19 L10.94 71.88 L10.94 28.13 Z"
                fill="url(#gf)" stroke="url(#g)" stroke-width="3.4" stroke-linejoin="round"/>
          <path d="M34.4 50.6 L45 61.25 L66.9 37.5" stroke="#E7C57A" stroke-width="5.2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="word">Essey</div>
      </div>
      <div class="tag">Borrow against your <b>onchain assets</b>.</div>
      <div class="eyebrow">Crypto &amp; tokenized stocks &nbsp;·&nbsp; every loan checked</div>
    </div>

    <div class="hair"></div>
    <div class="url">essey.xyz</div>
  </div>
</body></html>
